// Distant Horizons Retro build wrapper.
//
// The real build lives in dh/ and is included as a composite build. This wrapper only
// drives it and copies the jars, so GTNH Actions can build it like any other repo.

pluginManagement {
    repositories {
        maven {
            name = 'GTNH Maven'
            url = uri('https://nexus.gtnewhorizons.com/repository/public/')
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'distant-horizons-retro'

// Sets mod_version for this build and dh/
apply from: 'dh/version.gradle'

includeBuild('dh')
