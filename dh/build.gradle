plugins {
    id 'java'
}

// mod_version is set in version.gradle
rootProject.ext.mod_version = gradle.ext.mod_version

allprojects {
    version = (it == rootProject ? "" : it.name + "-") + rootProject.mod_version + "-" + rootProject.minecraft_version
    group = rootProject.maven_group

    // Custom javadoc tags for all subprojects
    plugins.withType(JavaPlugin) {
        javadoc {
            options.tags(
                'todo:X"',
                'apiNote:a:API Note:',
                'implSpec:a:Implementation Requirements:',
                'implNote:a:Implementation Note:'
            )
        }
    }
}
