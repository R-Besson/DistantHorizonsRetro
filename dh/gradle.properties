# Gradle stuff
org.gradle.jvmargs=-Xmx4096M
org.gradle.parallel=true
org.gradle.caching=true

# Mod Info
# mod_version comes from the git tag, see version.gradle
mod_name=DistantHorizonsRetro
api_name=DistantHorizonsApi
api_version=7.2.0
maven_group=com.seibel.distanthorizons
mod_readable_name=Distant Horizons Retro
mod_id=distanthorizons
mod_description=This mod generates and renders simplified terrain beyond the normal view distance at a low performance cost. Allowing you to see much farther without turning your game into a slideshow.
mod_authors=["James Seibel", "Leonardo Amato", "Cola", "coolGi", "Ran", "Leetom", "pshsh", "Karnatour"]
mod_homepage=https://github.com/R-Besson/DistantHorizonsRetro

# Minecraft
minecraft_version=1.7.10
forge_version=10.13.4.1614-1.7.10
java_version=8
lwjgl2_version=2.9.1
netty_version=4.0.23.Final

# Library Versions
nightconfig_version=3.9.0
lz4_version=1.8.0
xz_version=1.12
zstd_version=1.5.7-12
# Before updating, read relocate_natives/README.md
sqlite_jdbc_version=3.53.2.1
fastutil_version=8.2.1
dh_core_java_version=8
log4j_version=2.23.1
joml_version=1.10.2

# Angelica
# 0 = Don't enable and don't run
# 1 = Can be referenced in code but doesn't run
# 2 = Can be referenced in code and runs in the dev client
enable_angelica=1

# These can be set from the command line, if null they're read from git
infoGitCommit=null
infoGitBranch=null
infoBuildSource=User

# Maximum memory for the dev client
minecraftMemoryJavaArg=-Xmx6G
