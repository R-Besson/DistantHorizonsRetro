plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
    maven { url = 'https://maven.wagyourtail.xyz/releases' } // unimined libs
    maven { url = 'https://maven.outlands.top/releases' } // Hosts the kappa fork of unimined
    maven { url = 'https://maven.fabricmc.net/' } // unimined's remapper
    maven { url = 'https://maven.neoforged.net/releases/' } // unimined's binary patcher
    maven { url = 'https://maven.minecraftforge.net/' } // Forge
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } // Hosts minecraft libs
}

dependencies {
    implementation 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'
    implementation 'xyz.wagyourtail.unimined:xyz.wagyourtail.unimined.gradle.plugin:1.4.43-kappa'

    // ASM is used by GenerateLWJGLAbstraction.groovy
    // to generate the older LWJGL versions
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-tree:9.6'
}
