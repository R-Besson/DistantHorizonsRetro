plugins {
    id 'dh-loader'
}

// extra mods for the Java 25 dev client (see forge17/build.gradle)
configurations.maybeCreate("java25Mods")

unimined.minecraft 
{
    minecraftForge 
    {
        loader gradle.ext.forge_version
        useToolchains = false
        accessTransformer project(":common").file("src/main/resources/${gradle.ext.accessWidenerVersion}.distanthorizons_at.cfg")
        mixinConfig("DistantHorizons.forge.mixins.json")
    }

    mods 
    {
        //remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
        remap(configurations.java25Mods)
    }
}
