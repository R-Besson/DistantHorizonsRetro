plugins {
    id 'dh-loader'
}

// extra mods for the dev client (see forge17/build.gradle)
configurations.maybeCreate("java25Mods")
configurations.maybeCreate("devClientMods")

unimined.minecraft
{
    minecraftForge
    {
        loader rootProject.forge_version
        useToolchains = false
        accessTransformer project(":common").file("src/main/resources/1_7_10.distanthorizons_at.cfg")
        mixinConfig("DistantHorizons.forge.mixins.json")
    }

    mods
    {
        remap(configurations.modRuntimeOnly)
        remap(configurations.java25Mods)
        remap(configurations.devClientMods)
        {
            mixinRemap
            {
                reset()
                enableBaseMixin()
                enableMixinExtra()
            }
        }
    }
}
