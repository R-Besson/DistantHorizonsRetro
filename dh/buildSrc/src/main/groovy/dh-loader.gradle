import com.github.jengelman.gradle.plugins.shadow.transformers.ResourceTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.TransformerContext
import org.apache.tools.zip.ZipEntry
import org.apache.tools.zip.ZipOutputStream

import javax.annotation.Nonnull
import java.util.function.Function
import java.util.function.Predicate
import groovy.json.JsonSlurper

import com.seibel.distanthorizons.GenerateLWJGLAbstraction

// Convention plugin for the MC-facing subprojects (common + forge17).
// Common uses this directly; forge17 uses it via unimined-forge17.
// IMPORTANT: unimined MUST be applied before shadow
// so its afterEvaluate runs first and can modify configs.

plugins {
    id 'java'
    id 'java-library'
    id 'xyz.wagyourtail.unimined'
    id 'com.gradleup.shadow'
}

def isNotCommonProject = project.name != "common"

if (isNotCommonProject) {
    evaluationDependsOn(":common")
}

def lwjgl2Version = rootProject.lwjgl2_version
def lwjgl3Version = "3.3.1"
def atFileName = "1_7_10.distanthorizons_at.cfg"


// ==================== Repositories ====================

repositories {
    maven { url "https://libraries.minecraft.net/" }
    mavenCentral()
    maven { url "https://repo.enonic.com/public/" }
    maven {
        url "https://jitpack.io"

        content {
            excludeGroup "com.github.GTNewHorizons" // resolve GTNH mods with GTNH Maven
            excludeGroup "io.github.legacymoddingmc" // resolve UniMixins with GTNH Maven
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        url "https://repo.spongepowered.org/maven/"
        content { excludeGroupByRegex "net\\.fabricmc(\\..*)?" }
    }
}


// ==================== Java Config ====================

tasks.withType(JavaCompile).configureEach {
    // Used instead of "release" so we can have the LWJGL libs access "sun.misc.Unsafe"
    // and to prevent ByteBuffer NoSuchMethod errors.
    // ByteBuffer issue reason: https://www.morling.dev/blog/bytebuffer-and-the-dreaded-nosuchmethoderror/
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version as Integer)
    }

    options.encoding = "UTF-8"

    // silence the "java 8 is deprecated" javac compiler warnings
    options.compilerArgs << '-Xlint:-options'
}

java {
    sourceCompatibility = rootProject.java_version as Integer
    targetCompatibility = rootProject.java_version as Integer
    withSourcesJar()
}

// ==================== Configurations ====================

evaluationDependsOn(":core")

configurations {
    shadowMe
    coreProjects
    shadowMe.extendsFrom(coreProjects)
    implementation.extendsFrom(shadowMe)

    common
    implementation.extendsFrom(common)

    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

// ==================== Loader-Only Config ====================

if (isNotCommonProject) {
    base { archivesName = rootProject.mod_name }

    javadoc.title = rootProject.mod_name + "-" + project.name

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
    tasks.withType(Test).configureEach {
        enabled = false
    }
    compileTestJava.enabled = false

    jar {
        manifest {
            attributes(
                'Implementation-Title': rootProject.mod_name,
                'Implementation-Version': rootProject.mod_version,
                'Multi-Release': true,
                'Main-Class': 'com.seibel.distanthorizons.core.jar.JarMain',
                'FMLCorePlugin': 'com.seibel.distanthorizons.DistantHorizonsTweaker',
                'FMLCorePluginContainsFMLMod': true,
                'FMLAT': atFileName,
                'ForceLoadAsMod': true,
                "Lwjgl3ify-Aware": true
            )
        }
    }
}


// ==================== Unimined Minecraft Config ====================

unimined.minecraft(sourceSets.main, true) {
    version rootProject.minecraft_version

    mappings {
        mcp("stable", "12-1.7.10")
        devNamespace "mcp"
    }
}

if (isNotCommonProject) {
    // Mixin remapping and common project wiring
    unimined.minecraft(sourceSets.main, true) {
        mods.modImplementation {
            mixinRemap {
                reset()
                enableBaseMixin()
                enableMixinExtra()
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        source(project(":common").sourceSets.main.allSource)
        source(project(":common").sourceSets.lwjglCommon.allSource)
        source(project(":common").sourceSets.lwjgl2.allSource)
    }

    dependencies {
        implementation(project(":common"))
    }

    // lwjgl3ify replaces LWJGL 2 at runtime, so the LWJGL 3 classes are bundled too
    def lwjgl3Classes = files(project(":common").sourceSets.lwjgl3.output.classesDirs)
    lwjgl3Classes.builtBy(project(":common").tasks.named("compileLwjgl3Java"))

    dependencies {
        shadowMe lwjgl3Classes
    }

    processResources {
        from project(":common").sourceSets.main.resources
    }

    tasks.named(compileJava.name).configure {
        dependsOn(project(":common").tasks.named("generateAbstractionLayer"))
    }
} else {
    unimined.minecraft {
        minecraftForge {
            loader rootProject.forge_version
            accessTransformer project.file("src/main/resources/${atFileName}")
        }
        defaultRemapJar = false
        runs.off = true
    }
}

// ==================== LWJGL 2/3 Abstraction (common only) ====================
// LWJGL is only resolved in :common via unimined; :core never touches it directly.
// So the abstraction sourceSets/generation task live here, then gets exposed to
// forge17 through common's outgoing variants.

if (!isNotCommonProject) {
    def generatedSourcesDir = layout.buildDirectory.dir("generated/sources/lwjgl-abstraction/java")

    sourceSets {
        lwjglCommon {
            java.srcDir(generatedSourcesDir.map { it.dir("main") })
        }
        lwjgl2 {
            java.srcDir(generatedSourcesDir.map { it.dir("lwjgl2") })
            compileClasspath += main.compileClasspath
            compileClasspath += lwjglCommon.output
        }
        lwjgl3 {
            java.srcDir(generatedSourcesDir.map { it.dir("lwjgl3") })
            compileClasspath += main.compileClasspath
            compileClasspath += lwjglCommon.output
        }
        main {
            compileClasspath += lwjglCommon.output
        }
    }

    def generateAbstractionLayer = tasks.register("generateAbstractionLayer", GenerateLWJGLAbstraction.class) {
        lwjgl2Classpath.from(configurations.named("lwjgl2CompileClasspath"))
        lwjgl3Classpath.from(configurations.named("lwjgl3CompileClasspath"))
        outputDirectory.set(generatedSourcesDir)
    }

    tasks.named("compileLwjglCommonJava").configure {
        dependsOn(generateAbstractionLayer)
    }

    dependencies {
        lwjgl3CompileOnly(platform("org.lwjgl:lwjgl-bom:${lwjgl3Version}"))
        lwjgl3CompileOnly "org.lwjgl:lwjgl"
        lwjgl3CompileOnly "org.lwjgl:lwjgl-opengl"

        lwjgl2CompileOnly("org.lwjgl.lwjgl:lwjgl:${lwjgl2Version}")
    }

    jar {
        from(sourceSets.lwjglCommon.output)
        from(sourceSets.lwjgl2.output)
        from(sourceSets.lwjgl3.output)
        manifest {
            attributes([
                "Lwjgl3ify-Aware": "true"
            ])
        }
    }

    def extraSourceSets = [sourceSets.lwjglCommon, sourceSets.lwjgl2]

    configurations {
        apiElements
        runtimeElements
    }

    extraSourceSets.each { srcSet ->
        ["apiElements", "runtimeElements"].each { conf ->
            configurations.getByName(conf).outgoing.variants.named("classes") {
                artifact(srcSet.java.destinationDirectory) {
                    builtBy tasks.named(srcSet.compileJavaTaskName)
                }
            }
        }
    }
}


// ==================== Dependencies ====================

// Copy core's compileOnly deps so MC-provided deps are visible without redeclaring them.
project(":core").configurations.compileOnly.allDependencies.each { dep ->
    if (!(dep instanceof ProjectDependency))
        dependencies.add("compileOnly", dep)
}

dependencies {
    // NightConfig: implementation in core (bundled) but Unimined strips it from compile classpath
    compileOnly("com.electronwill.night-config:toml:${rootProject.nightconfig_version}")

    // Core & API projects — bundled into shadow jar
    coreProjects(project(":core"))
    coreProjects(project(":api"))

    // 1.7.10 doesn't bundle JOML or fastutil (core has them compileOnly already)
    shadowMe("org.joml:joml:${rootProject.joml_version}")
    shadowMe("it.unimi.dsi:fastutil:${rootProject.fastutil_version}")

    if (isNotCommonProject)
        common(project(":common")) { transitive false }
}


// ==================== NativeTransformer ====================

class NativeTransformer implements ResourceTransformer {
    private Predicate<String> fileMatcher
    private Function<String, String> filePathMapper

    private final HashMap<String, String> replacements = new HashMap()
    private final HashMap<String, byte[]> rewrittenFiles = new HashMap()
    private nativeRelocator

    public File rootDir

    void matchFiles(Predicate<String> matcher) {
        fileMatcher = matcher
    }

    void mapPaths(Function<String, String> mapper) {
        filePathMapper = mapper
    }

    void relocateNative(String target, String replacement) {
        if (replacement.length() > target.length()) {
            throw new GradleException("Length of value \"${replacement}\" exceeds the length of \"${target}\": ${replacement.length()} > ${target.length()}")
        }
        replacements.put(target, replacement)
    }

    @Override
    boolean canTransformResource(@Nonnull FileTreeElement element) {
        return fileMatcher != null && fileMatcher.test(element.relativePath.pathString)
    }

    @Override
    void transform(@Nonnull TransformerContext context) {
        byte[] content = context.inputStream.readAllBytes()

        if (nativeRelocator == null) {
            nativeRelocator = new NativeRelocator(rootDir.toPath().resolve("relocate_natives"))
        }

        try {
            String path = filePathMapper != null
                ? filePathMapper.apply(context.path)
                : context.path
            content = nativeRelocator.processBinary(path, content, replacements)
            rewrittenFiles.put(path, content)
        }
        catch (Throwable e) {
            throw new GradleException("Failed to relocate", e)
        }
    }

    @Override
    boolean hasTransformedResource() { return !rewrittenFiles.isEmpty() }

    @Override
    void modifyOutputStream(@Nonnull ZipOutputStream os, boolean preserveFileTimestamps) {
        for (Map.Entry<String, byte[]> rewrittenFile : rewrittenFiles.entrySet()) {
            os.putNextEntry(new ZipEntry(rewrittenFile.key))
            os.write(rewrittenFile.value)
        }
    }
}


// ==================== Shadow JAR (loaders only) ====================

if (isNotCommonProject) {
    shadowJar {
        configurations = [project.configurations.shadowMe]
        def librariesLocation = "DistantHorizons.libraries"

        // Keep bundled FastUtil separate from versions supplied by other mods.
        relocate "it.unimi.dsi.fastutil", "${librariesLocation}.unimi.dsi.fastutil"

        // LZ4 compression
        relocate "net.jpountz", "${librariesLocation}.jpountz"

        // SLF4J
        relocate "org.slf4j", "${librariesLocation}.slf4j"

        // SQLite
        relocate "org.sqlite", "dh_sqlite", { exclude "org/sqlite/native/**" }
        relocate "jdbc:sqlite", "jdbc:dh_sqlite"

        transform(NativeTransformer) {
            rootDir = project.rootDir
            matchFiles { it.startsWith("org/sqlite") }
            mapPaths { it.replace("org/sqlite", "dh_sqlite") }
            relocateNative "org/sqlite", "dh_sqlite"
            relocateNative "org_sqlite", "dh_1sqlite"
        }

        // ZStd compression
        relocate "com.github.luben", "dhcomgithubluben"
        relocate "libzstd-jni", "libzstd-jni_dh"
        relocate "zstd-jni", "zstd-jni_dh"

        // XZ compression
        relocate "org.tukaani", "${librariesLocation}.tukaani"

        transform(NativeTransformer) {
            rootDir = project.rootDir
            matchFiles { it.contains("libzstd-jni") && !it.contains("aix/ppc64") }
            mapPaths { it.replace("libzstd-jni", "libzstd-jni_dh") }
            relocateNative "com/github/luben", "dhcomgithubluben"
            relocateNative "com_github_luben", "dhcomgithubluben"
        }

        relocate "org.joml", "${librariesLocation}.joml"

        // NightConfig
        relocate "com.electronwill.nightconfig", "${librariesLocation}.electronwill.nightconfig"

        mergeServiceFiles()
    }

    afterEvaluate {
        tasks.named("remapJar").configure {
            dependsOn(shadowJar)
            inputFile.set(shadowJar.archiveFile)
        }

        // The shadow jar isn't put on the run classpath, it's copied into the mods folder
        // below, so leave out everything it bundles.
        def shadowedPaths = configurations.shadowMe.resolve().collect { it.path }.toSet()
        def loaderPaths = configurations.minecraftLibraries.resolve().collect { it.path }.toSet()
        tasks.withType(JavaExec).configureEach { runTask ->
            runTask.javaLauncher.set(
                javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(rootProject.java_version)
                }
            )

            dependsOn(shadowJar)
            classpath = classpath.filter { file ->
                !file.path.contains(project.buildDir.path) &&
                    !file.path.contains("core${File.separator}build") &&
                    !file.path.contains("api${File.separator}build") &&
                    !file.path.contains("common${File.separator}build") &&
                    !(shadowedPaths.contains(file.path) && !loaderPaths.contains(file.path))
            }

            boolean isClient = runTask.name.toLowerCase().contains("client")
            runTask.workingDir = rootProject.file("run/${isClient ? 'client' : 'server'}")

            doFirst {
                def modsDir = rootProject.file("run/${isClient ? 'client' : 'server'}/mods")
                modsDir.mkdirs()

                // Remove any stale DH jars before copying the fresh one
                modsDir.listFiles()?.each({ file ->
                    if (file.name.startsWith(rootProject.mod_name) || file.name.startsWith("DistantHorizons-"))
                    {
                        file.delete()
                    }
                });

                copy {
                    from shadowJar.archiveFile
                    into modsDir
                }
            }

            // add -Dmixin.debug.export=true to dump the mixed-in classes to .mixin.out
            runTask.jvmArgs(
                "-Dio.netty.leakDetection.level=advanced",
                rootProject.minecraftMemoryJavaArg,
            )

            if (isClient) {
                // use a consistent username for easier debugging in a given world
                runTask.args("--username", "Dev")
            }
        }

        tasks.jar.finalizedBy(tasks.named("remapJar"))
    }
}


// ==================== Process Resources (loaders only) ====================

if (isNotCommonProject) {
    processResources {
        def resourceTargets = [
            "build_info.json",
            "mcmod.info",
        ]

        try {
            if (rootProject.infoGitCommit == "null")
                rootProject.ext.infoGitCommit = 'git rev-parse --verify HEAD'.execute().text.trim()
            if (rootProject.infoGitBranch == "null")
                rootProject.ext.infoGitBranch = 'git symbolic-ref --short HEAD'.execute().text.trim()
        } catch (Exception e) {
            rootProject.ext.infoGitCommit = "Git not found"
            rootProject.ext.infoGitBranch = "Git not found"
        }

        def replaceProperties = [
            version          : rootProject.mod_version,
            mod_id           : rootProject.mod_id,
            mod_name         : rootProject.mod_readable_name,
            authors          : rootProject.mod_authors,
            description      : rootProject.mod_description,
            homepage         : rootProject.mod_homepage,

            info_git_commit  : rootProject.infoGitCommit,
            info_git_branch  : rootProject.infoGitBranch,
            info_build_source: rootProject.infoBuildSource,

            logo_path        : "assets/distanthorizons/icon.png",
        ]

        inputs.properties replaceProperties
        filesMatching(resourceTargets) {
            expand replaceProperties
        }
    }


    // ==================== Resource Copy Tasks ====================

    task copyCoreResources(type: Copy) {
        from fileTree(project(":core").file("src/main/resources"))
        into project.file("build/resources/main")
    }

    tasks.register("convertJsonToLang") {
        dependsOn(copyCoreResources)

        File inputDirectory = project.file("build/resources/main/assets/distanthorizons/lang")
        File outputDirectory = project.file("build/generated/legacyLang")
        inputs.dir(project(":core").file("src/main/resources/assets/distanthorizons/lang"))
        outputs.dir(outputDirectory)
        doLast {
            project.delete(outputDirectory)
            outputDirectory.mkdirs()
            fileTree(inputDirectory).matching { include "*.json" }.each { input ->
                String locale = input.name.substring(0, input.name.length() - ".json".length())
                // 1.7.10 resolves locale names with an uppercase region (for example, en_US).
                locale = locale.replaceFirst(/^([a-z]{2,3})_([a-z]{2})$/, { match, language, region ->
                    "${language}_${region.toUpperCase(java.util.Locale.ROOT)}"
                })
                File output = new File(outputDirectory, "${locale}.lang")
                output.withWriter("UTF-8") { writer ->
                    writer.writeLine("#PARSE_ESCAPES")
                    new JsonSlurper()
                        .parse(input)
                        .each { key, value ->
                            def text = value.toString().replaceAll(/%(?!((\d+)\$)?s|%)/, "%%").replace("\n", "\\n")
                            writer.writeLine("${key}=${text}")
                        }
                }
            }
        }
    }
}
