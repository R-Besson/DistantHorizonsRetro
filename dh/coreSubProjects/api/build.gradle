plugins {
    id "java"
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = rootProject.dh_core_java_version as Integer
    options.encoding = "UTF-8"
}

configurations {
    testImplementation.extendsFrom compileOnly
}

dependencies {
    compileOnly "org.apache.logging.log4j:log4j-api:${rootProject.log4j_version}"
    testImplementation "junit:junit:4.13.2"
}

java {
    withSourcesJar()
}

// ModVersion.VERSION, read by ModInfo.VERSION
def generateModVersion = tasks.register("generateModVersion") {
    def version = rootProject.mod_version
    def outputDir = layout.buildDirectory.dir("generated/sources/modVersion/java")
    inputs.property("version", version)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file("com/seibel/distanthorizons/coreapi/ModVersion.java").asFile
        file.parentFile.mkdirs()
        file.text = """package com.seibel.distanthorizons.coreapi;

final class ModVersion
{
\tstatic final String VERSION = "${version}";
}
"""
    }
}
sourceSets.main.java.srcDir(generateModVersion)

javadoc {
    options {
        // Don't log warnings.
        // There are a lot of warnings related to missing @param and @return javadocs
        // that aren't necessary and would clutter up said javadocs.
        // For more info see: https://docs.oracle.com/javase/8/docs/technotes/tools/windows/javadoc.html
        addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}

// set the jar name
def configureJar = { task ->
    // outputs in the format:
    // "DistantHorizonsApi-6.0.0.jar"
    // "DistantHorizonsApi-6.0.0-sources.jar"
    task.archiveBaseName = rootProject.api_name
    task.archiveVersion = rootProject.api_version
}
configureJar(tasks.named("jar").get())
configureJar(tasks.named("sourcesJar").get())
