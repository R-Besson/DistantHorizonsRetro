plugins {
    // foojay automatically downloads the appropriate JDK if the required
    // one is missing
    // https://docs.gradle.org/current/userguide/toolchains.html#sub:download_repositories
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

apply from: 'version.gradle'

// Minecraft-independent sub-projects
include("core")
project(":core").projectDir = file('coreSubProjects/core')
include("api")
project(":api").projectDir = file('coreSubProjects/api')

// Minecraft-dependent sub-projects
include("common")
include("forge17")

rootProject.name = "DistantHorizons"
